# Proxy vers le back NestJS AGBE : réglages communs à toutes les routes (sans tampon ni délais de lecture).
proxy_pass http://agbe_back;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;      # IP réelle uniquement (pas de chaîne falsifiable)
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
proxy_intercept_errors off;
# Le back (helmet) pose aussi des en-têtes de sécurité. nginx hérite des add_header du niveau server
# (snippet agbe-security-headers.conf) : on masque ceux du back pour éviter les doublons
# (un HSTS ou une CSP en double peut faire baisser la note). Cache-Control: no-store du back est conservé.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header X-Permitted-Cross-Domain-Policies;
proxy_hide_header Origin-Agent-Cluster;
# Compteurs de limitation du back : inutile de les exposer.
proxy_hide_header X-RateLimit-Limit;
proxy_hide_header X-RateLimit-Remaining;
proxy_hide_header X-RateLimit-Reset;
# Les réponses JSON de l'API reçoivent la CSP la plus stricte (au lieu de celle de la page).
include /etc/nginx/snippets/agbe-api-headers.conf;
